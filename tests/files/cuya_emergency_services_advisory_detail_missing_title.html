<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Event Details</title>
</head>
<body>
    <main class="main-content" role="main" id="main">
        <div class="moudle detail events" itemscope itemtype="http://schema.org/Event">
            <header class="head">
                <!-- Title heading exists but has no usable text -->
                <h1 class="title" itemprop="name">&#160; &#160; &#160;</h1>
                <div class="content">
                </div>
                <div class="meta">
                    <div class="meta-item" itemprop="startDate" content="2024-02-13T14:00">
                        <h2>Date and time:</h2>
                        <p>February 13, 2024 <span> &nbsp; </span> 9:00 AM<span> - </span> 10:00 AM</p>
                    </div>
                </div>
                <div class="meta">
                    <div class="meta-item" itemprop="location" itemscope itemtype="http://schema.org/Place">
                        <h2>Location</h2>
                        <p itemprop="address" itemscope itemtype="http://schema.org/PostalAddress">
                            <span itemprop="streetAddress"> 4747 East 49th Street, Cleveland, OH</span>
                        </p>
                    </div>
                </div>
            </header>
            <div class="related-content">
                <a href="https://cuyahogacms.blob.core.windows.net/home/docs/default-source/boards-and-commissions/other/ccesab/em/2024/021324-emagenda.pdf">
                    <span>Agenda</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
