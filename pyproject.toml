[project]
name = "mecha-keys"
version = "0.3.0"
description = "Local dashboard that tells you how much life is left on your AI API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JoaquinRuiz", email = "jokioki@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.27",
    "rich>=13.9",
    "httpx>=0.28",
    "pydantic>=2.10",
    "platformdirs>=4.3",
    "cryptography>=44",
    "keyring>=25",
]

[project.scripts]
mecha = "mecha.cli:main"
mecha-keys = "mecha.cli:main"

[project.urls]
Repository = "https://github.com/JoaquinRuiz/mecha"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mecha"
# src/mecha/static/ is generated by `vite build` and git-ignored, but it must
# ship inside the wheel. uv_build selects files from the module directory, not
# from git, so nothing is needed here; CI asserts static/index.html is present.
# `.gitkeep` placeholders are kept out of distributions.
wheel-exclude = [".gitkeep"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
files = ["src/mecha"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # Starlette's TestClient nudges towards a different HTTP client; not relevant here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
