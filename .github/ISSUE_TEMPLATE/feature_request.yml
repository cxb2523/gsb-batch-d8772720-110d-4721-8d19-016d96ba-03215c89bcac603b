name: Feature request
description: Propose a scoped improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include expected safety gates and dry-run behavior.
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Responsible use
      options:
        - label: This request is for accounts and content the operator owns or is authorized to manage.
          required: true
