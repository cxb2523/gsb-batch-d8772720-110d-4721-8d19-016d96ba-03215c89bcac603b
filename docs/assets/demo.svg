  <text x="391" y="21" font-size="12" fill="#7C8899"
        text-anchor="middle">prism — demo</text>

    <text y="62" class="ln" xml:space="preserve" style="animation-name:l0"><tspan x="22.0" fill="#4ADE80">$ </tspan><tspan x="37.7" fill="#FFFFFF">pip install prism-insights</tspan></text>
  <text y="83" class="ln" xml:space="preserve" style="animation-name:l1"><tspan x="22.0" fill="#7C8899">Successfully installed prism-insights-0.3.0</tspan></text>
  <text y="125" class="ln" xml:space="preserve" style="animation-name:l3"><tspan x="22.0" fill="#4ADE80">$ </tspan><tspan x="37.7" fill="#FFFFFF">prism demo</tspan></text>
  <text y="167" class="ln" xml:space="preserve" style="animation-name:l5"><tspan x="22.0" fill="#7C8899">Prism demo · bundled anonymized data</tspan></text>
  <text y="209" class="ln" xml:space="preserve" style="animation-name:l7"><tspan x="22.0" fill="#7DD3FC">① Collect-rate ranking (save/like — Prism's core signal):</tspan></text>
  <text y="230" class="ln" xml:space="preserve" style="animation-name:l8"><tspan x="22.0" fill="#4ADE80">    2.38</tspan><tspan x="84.6" fill="#C9D4E3">  save   1520 / like    640   </tspan><tspan x="319.5" fill="#E6EDF3">Every visa document I needed, in order</tspan></text>
  <text y="251" class="ln" xml:space="preserve" style="animation-name:l9"><tspan x="22.0" fill="#4ADE80">    1.82</tspan><tspan x="84.6" fill="#C9D4E3">  save   1655 / like    910   </tspan><tspan x="319.5" fill="#E6EDF3">Reading a rental contract line by line</tspan></text>
  <text y="272" class="ln" xml:space="preserve" style="animation-name:l10"><tspan x="22.0" fill="#4ADE80">    1.82</tspan><tspan x="84.6" fill="#C9D4E3">  save   1490 / like    820   </tspan><tspan x="319.5" fill="#E6EDF3">How to pick a rice cooker without overpaying</tspan></text>
  <text y="293" class="ln" xml:space="preserve" style="animation-name:l11"><tspan x="22.0" fill="#4ADE80">     1.6</tspan><tspan x="84.6" fill="#C9D4E3">  save   1980 / like   1240   </tspan><tspan x="319.5" fill="#E6EDF3">12 museums in the city that are free on Sunda…</tspan></text>
  <text y="314" class="ln" xml:space="preserve" style="animation-name:l12"><tspan x="22.0" fill="#4ADE80">    1.24</tspan><tspan x="84.6" fill="#C9D4E3">  save   2610 / like   2100   </tspan><tspan x="319.5" fill="#E6EDF3">Beginner sourdough: the whole schedule on one…</tspan></text>
  <text y="356" class="ln" xml:space="preserve" style="animation-name:l14"><tspan x="22.0" fill="#7DD3FC">② By content type (avg saves):</tspan></text>
  <text y="377" class="ln" xml:space="preserve" style="animation-name:l15"><tspan x="22.0" fill="#C9D4E3">   image    n=9    avg_save=</tspan><tspan x="241.2" fill="#4ADE80">1748</tspan></text>
  <text y="398" class="ln" xml:space="preserve" style="animation-name:l16"><tspan x="22.0" fill="#C9D4E3">   video    n=11   avg_save=</tspan><tspan x="241.2" fill="#7C8899">693</tspan></text>
  <text y="440" class="ln" xml:space="preserve" style="animation-name:l18"><tspan x="22.0" fill="#C9D4E3">③ Save distribution: n=20 median=940 p90=1980 max=2610</tspan></text>
  <text y="461" class="ln" xml:space="preserve" style="animation-name:l19"><tspan x="22.0" fill="#C9D4E3">④ Save concentration: HHI=657 top3-share=0.284</tspan></text>
  <text y="503" class="ln" xml:space="preserve" style="animation-name:l21"><tspan x="22.0" fill="#4ADE80">✓</tspan><tspan x="29.8" fill="#7C8899"> offline demo data. Live: </tspan><tspan x="233.4" fill="#FFFFFF">prism analyze bilibili --limit 15</tspan></text>

