<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- ambient glow behind the prism -->
  <ellipse cx="360" cy="320" rx="200" ry="150" fill="#7DD3FC" opacity="0.07" filter="url(#softer)"/>

  <!-- incoming single beam -->
  <g filter="url(#soft)" opacity="0.85">
    <rect x="40" y="315" width="308" height="10" fill="url(#beam)"/>
  </g>
  <rect x="40" y="318" width="308" height="4" fill="url(#beam)"/>

  <!-- dispersed rays -->
  <g stroke-linecap="round" opacity="0.95">
    <g filter="url(#soft)" opacity="0.55">
      <line x1="430" y1="320" x2="700" y2="196" stroke="#F472B6" stroke-width="7"/>
      <line x1="430" y1="320" x2="700" y2="248" stroke="#FB923C" stroke-width="7"/>
      <line x1="430" y1="320" x2="700" y2="300" stroke="#FACC15" stroke-width="7"/>
      <line x1="430" y1="320" x2="700" y2="352" stroke="#4ADE80" stroke-width="7"/>
      <line x1="430" y1="320" x2="700" y2="404" stroke="#38BDF8" stroke-width="7"/>
      <line x1="430" y1="320" x2="700" y2="456" stroke="#A78BFA" stroke-width="7"/>
    </g>
    <line x1="430" y1="320" x2="700" y2="196" stroke="#F472B6" stroke-width="2.5"/>
    <line x1="430" y1="320" x2="700" y2="248" stroke="#FB923C" stroke-width="2.5"/>
    <line x1="430" y1="320" x2="700" y2="300" stroke="#FACC15" stroke-width="2.5"/>
    <line x1="430" y1="320" x2="700" y2="352" stroke="#4ADE80" stroke-width="2.5"/>
    <line x1="430" y1="320" x2="700" y2="404" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="430" y1="320" x2="700" y2="456" stroke="#A78BFA" stroke-width="2.5"/>
  </g>

  <!-- prism -->
  <path d="M 300 400 L 388 248 L 476 400 Z" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="760" y="252" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="104" font-weight="600" fill="#FFFFFF" letter-spacing="-2.5">Prism</text>

  <text x="762" y="306" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="400" fill="#C9D4E3" letter-spacing="-0.2">The analysis layer for social content</text>

  <!-- the claim -->
  <text x="762" y="382" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="600" fill="#FFFFFF" letter-spacing="-0.6">Ranks by <tspan fill="#4ADE80">save-rate</tspan>, not likes</text>

  <text x="762" y="424" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400" fill="#8B98A9">A like means “nice.” A save means “I’ll come back to this.”</text>

  <!-- footer meta -->
  <line x1="762" y1="472" x2="1180" y2="472" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1"/>
  <text x="762" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#7C8899" letter-spacing="0.3">Xiaohongshu · Bilibili · Douyin · Kuaishou</text>
  <text x="762" y="546" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#7C8899" letter-spacing="0.3">one schema · four lenses · MIT</text>
</svg>
